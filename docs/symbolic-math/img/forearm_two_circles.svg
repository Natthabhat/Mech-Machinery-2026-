<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" font-family="Helvetica, Arial, sans-serif">
<title>Forearm-length constraint as two intersecting circles</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2C2C2A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="590" fill="#ffffff"/>
<line x1="60" y1="560" x2="380" y2="560" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="229" cy="361" r="115" fill="none" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="5 4"/>
<path d="M61 325.6 A272 272 0 0 0 362.4 244.8" fill="none" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="229" y1="361" x2="116" y2="339" stroke="#D85A30" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
<line x1="116" y1="339" x2="154" y2="70" stroke="#888780" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
<line x1="229" y1="361" x2="318" y2="287" stroke="#D85A30" stroke-width="6" stroke-linecap="round"/>
<line x1="318" y1="287" x2="154" y2="70" stroke="#888780" stroke-width="4" stroke-linecap="round"/>
<line x1="229" y1="361" x2="157" y2="80" stroke="#2C2C2A" stroke-width="1" stroke-dasharray="2 3" marker-end="url(#arrow)"/>
<circle cx="229" cy="361" r="6" fill="#ffffff" stroke="#2C2C2A" stroke-width="1.5"/>
<circle cx="318" cy="287" r="6" fill="#ffffff" stroke="#D85A30" stroke-width="1.5"/>
<circle cx="116" cy="339" r="5" fill="#ffffff" stroke="#D85A30" stroke-width="1" opacity="0.6"/>
<circle cx="154" cy="70" r="5" fill="#ffffff" stroke="#7F77DD" stroke-width="1.5"/>
<g fill="#2C2C2A" font-size="15" font-weight="bold">
<text x="240" y="384">Aᵢ</text><text x="330" y="284">Bᵢ</text><text x="102" y="364" text-anchor="end">Bᵢ′</text><text x="166" y="62">Cᵢ</text></g>
<g fill="#5F5E5A" font-size="13">
<text x="200" y="222">d</text><text x="284" y="340">La</text><text x="248" y="172">Lb</text><text x="64" y="578">base top</text>
<text x="410" y="60">The elbow Bᵢ must be on both:</text>
<text x="410" y="86">coral circle: La from Aᵢ (the arm)</text>
<text x="410" y="108">purple circle: Lb from Cᵢ (the rods)</text>
<text x="410" y="140">They cross at two points:</text>
<text x="410" y="162">Bᵢ  elbow out (the one used)</text>
<text x="410" y="184">Bᵢ′ elbow folded in (faded)</text>
<text x="410" y="216">No crossing = hand out of reach</text>
<text x="410" y="248">d = Cᵢ − Aᵢ (dotted arrow)</text>
<text x="410" y="270">Triangle Aᵢ Bᵢ Cᵢ has sides La, Lb, |d|</text>
<text x="410" y="302">Example: leg 1, hand at p = (0, 0, 306) mm</text>
<text x="410" y="324">Bᵢ at q = −40°, Bᵢ′ at q = −169°</text>
<text x="410" y="346">Leg plane, to scale</text></g>
</svg>
