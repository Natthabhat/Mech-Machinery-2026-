<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="Helvetica, Arial, sans-serif">
<title>Points of one delta leg, top view</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="340" fill="#ffffff"/>
<circle cx="220" cy="200" r="100" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="3 4"/>
<line x1="220" y1="200" x2="124" y2="200" stroke="#888780" stroke-width="2"/>
<line x1="220" y1="200" x2="264" y2="276" stroke="#888780" stroke-width="2"/>
<circle cx="124" cy="200" r="4" fill="#888780"/><circle cx="264" cy="276" r="4" fill="#888780"/>
<line x1="220" y1="200" x2="370" y2="200" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M270 200 A50 50 0 0 0 245 156.7" fill="none" stroke="#D85A30" stroke-width="1.2"/>
<line x1="229" y1="104" x2="299" y2="144" stroke="#2C2C2A" stroke-width="1" stroke-dasharray="5 3"/>
<line x1="264" y1="124" x2="294" y2="71" stroke="#D85A30" stroke-width="6" stroke-linecap="round"/>
<line x1="216" y1="155" x2="272" y2="58" stroke="#888780" stroke-width="3" stroke-linecap="round"/>
<line x1="261" y1="181" x2="317" y2="84" stroke="#888780" stroke-width="3" stroke-linecap="round"/>
<line x1="272" y1="58" x2="317" y2="84" stroke="#D85A30" stroke-width="2"/>
<line x1="216" y1="155" x2="261" y2="181" stroke="#7F77DD" stroke-width="3"/>
<circle cx="264" cy="124" r="5" fill="#ffffff" stroke="#2C2C2A" stroke-width="1.5"/>
<circle cx="294" cy="71" r="5" fill="#ffffff" stroke="#D85A30" stroke-width="1.5"/>
<circle cx="238" cy="168" r="4" fill="#ffffff" stroke="#7F77DD" stroke-width="1.5"/>
<circle cx="220" cy="200" r="4" fill="#2C2C2A"/>
<g fill="#2C2C2A" font-size="15" font-weight="bold">
<text x="304" y="152">Aᵢ</text><text x="288" y="50">Bᵢ</text><text x="206" y="182" text-anchor="end">Cᵢ</text><text x="208" y="218" text-anchor="end">O</text></g>
<g fill="#5F5E5A" font-size="13">
<text x="124" y="222" text-anchor="middle">leg 1 (180°)</text><text x="272" y="296">leg 2 (300°)</text>
<text x="340" y="218">world x</text><text x="274" y="182">φᵢ</text><text x="326" y="80">w</text>
<text x="420" y="60">xᵢ  out along the leg (O → Aᵢ)</text>
<text x="420" y="84">yᵢ  along the shoulder axis (dashed)</text>
<text x="420" y="108">φᵢ  leg direction: 180°, 300°, 60°</text>
<text x="420" y="132">R  radius of the shoulder (dotted circle)</text>
<text x="420" y="156">w = 47 mm  spacing of the 2 rods</text>
<text x="420" y="180">T  tiny shift along yᵢ (&lt; 0.5 mm)</text>
<text x="420" y="216">red = upper arm + elbow bar (moves with qᵢ)</text>
<text x="420" y="240">gray = the two forearm rods</text>
<text x="420" y="264">purple = hand edge (moves with p)</text>
<text x="420" y="288">Rz turns world coords into leg i's frame</text></g>
</svg>
