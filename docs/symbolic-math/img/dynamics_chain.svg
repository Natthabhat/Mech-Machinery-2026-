<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif">
<title>Dynamics chain from motor to hand</title>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="250" fill="#ffffff"/>
<g stroke-width="0.5">
<rect x="40" y="60" width="104" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<rect x="164" y="60" width="104" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<rect x="288" y="60" width="104" height="64" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<rect x="412" y="60" width="104" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<rect x="536" y="60" width="104" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7"/></g>
<g font-size="14" font-weight="bold" text-anchor="middle">
<text x="92" y="87" fill="#444441">Motor</text><text x="216" y="87" fill="#444441">Capstan</text><text x="340" y="87" fill="#712B13">Upper arm</text><text x="464" y="87" fill="#444441">Rods</text><text x="588" y="87" fill="#3C3489">Hand</text></g>
<g font-size="12" text-anchor="middle">
<text x="92" y="109" fill="#5F5E5A">rotor J_m</text><text x="216" y="109" fill="#5F5E5A">ratio −N</text><text x="340" y="109" fill="#993C1D">I_a, G(q)</text><text x="464" y="109" fill="#5F5E5A">J and Jᵀ</text><text x="588" y="109" fill="#534AB7">m_p, user F</text></g>
<g stroke="#1D9E75" stroke-width="1.5"><line x1="146" y1="76" x2="162" y2="76" marker-end="url(#ag)"/><line x1="270" y1="76" x2="286" y2="76" marker-end="url(#ag)"/><line x1="394" y1="76" x2="410" y2="76" marker-end="url(#ag)"/><line x1="518" y1="76" x2="534" y2="76" marker-end="url(#ag)"/></g>
<g stroke="#D85A30" stroke-width="1.5"><line x1="162" y1="108" x2="146" y2="108" marker-end="url(#ar)"/><line x1="286" y1="108" x2="270" y2="108" marker-end="url(#ar)"/><line x1="410" y1="108" x2="394" y2="108" marker-end="url(#ar)"/><line x1="534" y1="108" x2="518" y2="108" marker-end="url(#ar)"/></g>
<g font-size="13" fill="#5F5E5A">
<text x="92" y="150" text-anchor="middle">5.6 g·cm²</text><text x="216" y="150" text-anchor="middle">N = 8.44</text><text x="340" y="150" text-anchor="middle">0.24 g·m²</text><text x="464" y="150" text-anchor="middle">≈ 30 mm/rad</text><text x="588" y="150" text-anchor="middle">191.1 g</text>
<text x="94" y="194">motion: arm turns 1/N of the motor, hand moves J·q̇</text>
<text x="94" y="220">force: hand force F gives shoulder torque Jᵀ·F, motor feels it ÷N</text></g>
<line x1="60" y1="190" x2="84" y2="190" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#ag)"/>
<line x1="84" y1="216" x2="60" y2="216" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
