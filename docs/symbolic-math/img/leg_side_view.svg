<text x="268" y="332">qᵢ</text><text x="242" y="296">La</text><text x="236" y="180">Lb</text>
<text x="134" y="128" text-anchor="middle">r</text><text x="166" y="574" text-anchor="middle">R</text><text x="308" y="440">H</text></g>
