<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="Helvetica, Arial, sans-serif">
<title>Rigid rod velocity condition</title>
<defs>
<marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="560" fill="#ffffff"/>
<line x1="60" y1="520" x2="380" y2="520" stroke="#5F5E5A" stroke-width="1"/>
<line x1="318" y1="406" x2="90" y2="104" stroke="#5F5E5A" stroke-width="0.75" stroke-dasharray="3 4"/>
<line x1="229" y1="480" x2="318" y2="406" stroke="#D85A30" stroke-width="6" stroke-linecap="round"/>
<line x1="318" y1="406" x2="154" y2="189" stroke="#888780" stroke-width="4" stroke-linecap="round"/>
<line x1="318" y1="406" x2="274.7" y2="348.7" stroke="#1D9E75" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
<line x1="154" y1="189" x2="110.7" y2="131.7" stroke="#1D9E75" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
<line x1="154" y1="189" x2="154" y2="103" stroke="#7F77DD" stroke-width="2" marker-end="url(#ap)"/>
<line x1="318" y1="406" x2="275" y2="355" stroke="#D85A30" stroke-width="2" marker-end="url(#ac)"/>
<line x1="154" y1="99" x2="110.7" y2="131.7" stroke="#5F5E5A" stroke-width="0.75" stroke-dasharray="2 3"/>
<circle cx="229" cy="480" r="6" fill="#ffffff" stroke="#2C2C2A" stroke-width="1.5"/>
<circle cx="318" cy="406" r="6" fill="#ffffff" stroke="#D85A30" stroke-width="1.5"/>
<circle cx="154" cy="189" r="5" fill="#ffffff" stroke="#7F77DD" stroke-width="1.5"/>
<g fill="#2C2C2A" font-size="15" font-weight="bold"><text x="240" y="502">Aᵢ</text><text x="330" y="412">Bᵢ</text><text x="166" y="200">Cᵢ</text><text x="436" y="258">n·ṗ = n·Ḃ</text></g>
<g fill="#5F5E5A" font-size="13">
<text x="162" y="116">ṗ (hand)</text><text x="286" y="342">Ḃ</text><text x="96" y="100" text-anchor="end">n</text><text x="270" y="450">arm La, turns at q̇ᵢ</text>
<text x="420" y="70">purple arrow: hand velocity ṗ</text>
<text x="420" y="92">coral arrow: elbow velocity Ḃ</text>
<text x="436" y="110">= La·q̇ᵢ, at 90° to the arm</text>
<text x="420" y="132">dotted line: rod direction n</text>
<text x="420" y="164">teal bars: both velocities</text>
<text x="436" y="182">projected onto n</text>
<text x="420" y="214">The rod can't stretch, so</text>
<text x="436" y="232">the two teal bars are equal:</text>
<text x="420" y="296">Example: hand straight up,</text>
<text x="436" y="314">arm turns up (q̇ &lt; 0)</text></g>
</svg>
